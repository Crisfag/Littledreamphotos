<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page introuvable — Holypixx</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { --ink: #0b0b10; --muted: #5a5a68; --accent: #3b3bf6; --line: #e7e7ee; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; background: #fff; color: var(--ink); font: 17px/1.6 Geist, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 34rem; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); font-weight: 600; text-decoration: none; letter-spacing: -0.02em; }
    .brand img { width: 30px; height: 30px; }
    h1 { margin-top: 40px; font-size: clamp(2.2rem, 7vw, 3.4rem); line-height: 1.04; letter-spacing: -0.04em; font-weight: 600; }
    p { margin-top: 16px; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    .btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 10px; font-weight: 500; text-decoration: none; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-quiet { background: #f6f6f9; color: var(--ink); }
    .btn:focus-visible, .brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/"><img src="/favicon.svg" alt="" width="30" height="30" />Holypixx</a>
    <h1>Cette page n'existe pas.</h1>
    <p>L'adresse a peut-être changé, ou elle contient une faute de frappe. Si vous cherchez une galerie, utilisez le lien exact reçu de votre photographe.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Retour à l'accueil</a>
      <a class="btn btn-quiet" href="/#tarifs">Voir les tarifs</a>
    </div>
  </main>
</body>
</html>
