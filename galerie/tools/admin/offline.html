<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f6f9" />
  <title>Hors connexion — Holypixx</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6f6f9; color: #0b0b10; text-align: center; }
    .mark { width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 14px; background: #3b3bf6; display: grid; place-items: center; }
    .mark svg { width: 30px; height: 30px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; }
    h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
    p { margin: 0 auto 1.4rem; max-width: 22rem; color: #62626f; line-height: 1.55; }
    button { font: inherit; font-weight: 500; color: #fff; background: #3b3bf6; border: 0; border-radius: 10px; padding: .75rem 1.4rem; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M10 8v16M22 8v16M10 16h12"/></svg></div>
    <h1>Pas de connexion</h1>
    <p>Holypixx a besoin d'Internet pour afficher vos galeries et vos réservations à jour. Vérifiez votre réseau, puis réessayez.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
