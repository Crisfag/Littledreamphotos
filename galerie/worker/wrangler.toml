name = "galerie-protegee"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Origines autorisées à appeler l'API (le site qui héberge la page galerie).
[vars]
ALLOWED_ORIGINS = "https://www.holypixx.com,https://holypixx.com,https://holypixx-web.pages.dev,https://www.littledreamphotos.com,http://localhost:8000"
# Lien inséré dans l'e-mail d'alerte de capture, vers l'interface d'administration.
ADMIN_URL = "https://holypixx-admin.onrender.com"

# Base de métadonnées : galeries, photos, journal d'accès.
# Créer avec :  npx wrangler d1 create galerie-protegee
# puis recopier l'identifiant renvoyé ci-dessous.
[[d1_databases]]
binding = "DB"
database_name = "galerie-protegee"
database_id = "3993cb4e-2d56-40c4-b848-40f313dbd2d3"

# Stockage des tuiles d'images.
# Créer avec :  npx wrangler r2 bucket create galerie-tuiles
[[r2_buckets]]
binding = "TILES"
bucket_name = "galerie-tuiles"

# Secrets (jamais dans ce fichier) :
#   npx wrangler secret put AUTH_SECRET    (sessions de compte photographe)
#   npx wrangler secret put TOKEN_SECRET   (sessions client d'une galerie)
#   npx wrangler secret put RESEND_API_KEY (optionnel : alertes e-mail de capture — https://resend.com)
#   npx wrangler secret put RESEND_FROM    (optionnel : adresse d'expédition vérifiée sur Resend)
# Sans RESEND_API_KEY, les captures restent consignées dans le journal mais
# aucun e-mail n'est envoyé — jamais d'erreur pour le client pour autant.
