name = "galerie-protegee"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Route du sous-domaine par studio (clé de premier niveau : placée après
# [triggers], elle était lue comme une option de [triggers] et ignorée).
# Toute adresse « *.holypixx.com » arrive
# ici (les studios sont servis, www et les noms réservés passent tels quels).
# Commentez ce bloc si la zone n'est pas encore sur ce compte Cloudflare.
routes = [
  { pattern = "*.holypixx.com/*", zone_name = "holypixx.com" },
]
# Garder aussi l'adresse galerie-protegee.….workers.dev : dès qu'une route est
# déclarée, wrangler la désactive au déploiement si ce n'est pas écrit ici.
# Or l'admin (GALERIE_API) et la page galerie (web/galerie.html) l'utilisent.
workers_dev = true

# Origines autorisées à appeler l'API (le site qui héberge la page galerie).
[vars]
ALLOWED_ORIGINS = "https://www.holypixx.com,https://holypixx.com,https://holypixx-web.pages.dev,https://www.littledreamphotos.com,http://localhost:8000"
# Lien inséré dans l'e-mail d'alerte de capture, vers l'interface d'administration.
ADMIN_URL = "https://holypixx-admin.onrender.com"
# Adresse du compte photographe qui a accès à l'onglet Admin (toutes
# galeries/comptes confondus, voir worker/src/owner.js) — jamais la seule
# foi du client : chaque route /api/owner/* revérifie côté serveur que le
# compte connecté correspond bien à cette adresse.
OWNER_EMAIL = "fagnantchristine@gmail.com"
# Module écoles, crèches et clubs (school.js) et ses formules Scolaire et
# Studio : "1" pour les proposer à tous ; sinon seule la propriétaire le voit.
SCHOOL_LAUNCHED = "0"
# Adresse publique du site qui héberge web/galerie.html : sert à construire
# le lien « Revoir ma galerie » des e-mails de relance envoyés aux clients.
PUBLIC_SITE_ORIGIN = "https://www.holypixx.com"

# Sous-domaine par studio (voir worker/src/studio.js) : julie.holypixx.com
# sert la page de galerie et l'API du Worker sur une même origine. Nécessite,
# côté DNS de la zone, un enregistrement joker « * » proxyé (voir README), et
# la route ci-dessous. Le site principal (www, apex) traverse le Worker sans
# être touché.
STUDIO_DOMAIN = "holypixx.com"

# Frais de paiement retenus sur chaque vente en ligne d'un photographe
# (suppléments, tirages) pour couvrir les frais Stripe que paie la
# plateforme — voir worker/src/fees.js. Pourcentage du montant + fixe en
# centimes. Un changement ne vaut que pour les paiements suivants.
PAYMENT_FEE_PERCENT = "2"
PAYMENT_FEE_FIXED_CENTS = "30"

# Relances automatiques (voir worker/src/reminders.js) : une passe par jour,
# 08:00 UTC (10:00 à Paris/Bruxelles en été, 09:00 en hiver). Client prévenu
# à J-7 puis J-2 de l'expiration de sa galerie tant qu'il n'a pas validé sa
# sélection, photographe prévenu à J-2. Sans RESEND_API_KEY, la passe tourne
# mais n'envoie rien.
[triggers]
# 8 h UTC : passes quotidiennes ; toutes les 30 min de 7 h à 18 h 30 UTC :
# rappels de commande aux familles (module scolaire), par petits paquets.
crons = ["0 8 * * *", "*/30 7-18 * * *"]

# Base de métadonnées : galeries, photos, journal d'accès.
# Créer avec :  npx wrangler d1 create galerie-protegee
# puis recopier l'identifiant renvoyé ci-dessous.
[[d1_databases]]
binding = "DB"
database_name = "galerie-protegee"
database_id = "3993cb4e-2d56-40c4-b848-40f313dbd2d3"

# Stockage des tuiles d'images.
# Créer avec :  npx wrangler r2 bucket create galerie-tuiles
[[r2_buckets]]
binding = "TILES"
bucket_name = "galerie-tuiles"

# Secrets (jamais dans ce fichier) :
#   npx wrangler secret put AUTH_SECRET          (sessions de compte photographe)
#   npx wrangler secret put TOKEN_SECRET         (sessions client d'une galerie)
#   npx wrangler secret put RESEND_API_KEY       (optionnel : alertes e-mail de capture — https://resend.com)
#   npx wrangler secret put RESEND_FROM          (optionnel : adresse d'expédition vérifiée sur Resend)
#   npx wrangler secret put STRIPE_SECRET_KEY    (optionnel : paiement en ligne des suppléments — https://stripe.com,
#                                                  nécessite Connect activé sur le compte plateforme)
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET (optionnel : signature du webhook account.updated, voir README)
# Sans RESEND_API_KEY, les captures restent consignées dans le journal mais
# aucun e-mail n'est envoyé — jamais d'erreur pour le client pour autant. Sans
# STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET, l'écran « Facturation » affiche
# un message clair plutôt que d'échouer silencieusement.
